<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Reframe design mock for a semantic illustration scenario</title>
  <desc id="desc">A deterministic design reference showing the current manuscript workspace and a proposed illustration participant attached to a movement and source location. It is not live evidence.</desc>
  <rect width="1600" height="980" fill="#111827"/>
  <rect x="34" y="28" width="1532" height="924" rx="24" fill="#f5f2ea"/>
