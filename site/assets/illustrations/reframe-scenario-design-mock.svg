  <text x="122" y="260" fill="#26323b" font-family="Georgia, serif" font-size="25" font-weight="700">Pyramus and Thisbe</text>
  <text x="122" y="302" fill="#3f4a50" font-family="Georgia, serif" font-size="19">The wall keeps what the lovers cannot say aloud.</text>
  <text x="122" y="336" fill="#3f4a50" font-family="Georgia, serif" font-size="19">Their question survives the passage without being resolved.</text>
  <rect x="122" y="372" width="610" height="3" fill="#d59a36"/>
  <text x="122" y="412" fill="#7e5e22" font-family="Arial, sans-serif" font-size="14">SOURCE LOCATION · lines 118–132 · proposed attachment point</text>
  <rect x="90" y="486" width="280" height="258" rx="12" fill="#e8f0ee"/>
  <text x="116" y="524" fill="#245b55" font-family="Arial, sans-serif" font-size="16" font-weight="700">MOVEMENTS</text>
  <text x="116" y="562" fill="#315c58" font-family="Arial, sans-serif" font-size="15">The wall becomes a witness.</text>
  <text x="116" y="590" fill="#315c58" font-family="Arial, sans-serif" font-size="13">source lines 118–132</text>
  <rect x="394" y="486" width="280" height="258" rx="12" fill="#f4e9ed"/>
  <text x="420" y="524" fill="#7e3f55" font-family="Arial, sans-serif" font-size="16" font-weight="700">QUESTIONS</text>
  <text x="420" y="562" fill="#704458" font-family="Arial, sans-serif" font-size="15">What remains unsaid?</text>
  <text x="420" y="590" fill="#704458" font-family="Arial, sans-serif" font-size="13">uncertainty retained</text>
  <rect x="698" y="486" width="278" height="258" rx="12" fill="#e9edf4"/>
  <text x="724" y="524" fill="#385273" font-family="Arial, sans-serif" font-size="16" font-weight="700">READ COVERAGE</text>
  <text x="724" y="562" fill="#45617d" font-family="Arial, sans-serif" font-size="15">Settled source window</text>
  <text x="724" y="590" fill="#45617d" font-family="Arial, sans-serif" font-size="13">design state only</text>
  <rect x="1032" y="116" width="500" height="690" rx="16" fill="#202936"/>
