  <text x="1096" y="332" fill="#d5dee5" font-family="Arial, sans-serif" font-size="14">would compose the prompt here.</text>
  <text x="1096" y="372" fill="#f4c95d" font-family="Arial, sans-serif" font-size="12">PROPOSED · NO STORE RECEIPT</text>
