<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Local FountainStore to remote Caddy production estate</title>
  <desc id="desc">The local FountainStore supplies an admitted semantic diff to EstatePublisher and FCIS-KIT. They create and promote one immutable release to remote Caddy. Caddy serves the public static estate, while digest, HTTPS, and rollback receipts return as evidence. Reframe observes the typed state.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b75a20"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#254f78"/></marker></defs>
  <rect width="1200" height="700" rx="28" fill="#f8f5ee"/><rect x="24" y="24" width="1152" height="652" rx="24" fill="none" stroke="#b9c5cf" stroke-width="2"/>
  <text x="70" y="80" fill="#254f78" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">ONE PRODUCTION PROFILE · ONE RELEASE IDENTITY</text><text x="70" y="116" fill="#1e2d3d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Local authority, immutable edge, honest evidence.</text>
  <rect x="70" y="185" width="250" height="160" rx="20" fill="#e5f1fa" stroke="#6d9fc7" stroke-width="2"/><rect x="385" y="185" width="300" height="160" rx="20" fill="#f6cc7b" stroke="#c27524" stroke-width="2"/><rect x="750" y="185" width="300" height="160" rx="20" fill="#dcefe5" stroke="#6eab87" stroke-width="2"/>
  <text x="98" y="222" fill="#254f78" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">SOURCE</text><text x="98" y="260" fill="#17324d" font-family="Arial,sans-serif" font-size="25" font-weight="700">Local FountainStore</text><text x="98" y="290" fill="#17324d" font-family="Arial,sans-serif" font-size="17">authored estate</text><text x="98" y="318" fill="#17324d" font-family="Arial,sans-serif" font-size="17">typed preflight snapshot</text>
  <text x="413" y="222" fill="#81430e" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">AUTHORITY</text><text x="413" y="260" fill="#17324d" font-family="Arial,sans-serif" font-size="25" font-weight="700">EstatePublisher + FCIS-KIT</text><text x="413" y="290" fill="#17324d" font-family="Arial,sans-serif" font-size="17">diff · sign · admit · receipt</text><text x="413" y="318" fill="#17324d" font-family="Arial,sans-serif" font-size="17">atomic release promotion</text>
  <text x="778" y="222" fill="#286445" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">EDGE</text><text x="778" y="260" fill="#17324d" font-family="Arial,sans-serif" font-size="25" font-weight="700">Remote Caddy</text><text x="778" y="290" fill="#17324d" font-family="Arial,sans-serif" font-size="17">immutable active root</text><text x="778" y="318" fill="#17324d" font-family="Arial,sans-serif" font-size="17">static HTTPS projection</text>
  <path d="M320 265H378" fill="none" stroke="#b75a20" stroke-width="5" marker-end="url(#a)"/><path d="M685 265H743" fill="none" stroke="#b75a20" stroke-width="5" marker-end="url(#a)"/><text x="330" y="245" fill="#81430e" font-family="Arial,sans-serif" font-size="14">semantic diff</text><text x="695" y="245" fill="#81430e" font-family="Arial,sans-serif" font-size="14">atomic promote</text>
  <rect x="180" y="445" width="330" height="105" rx="18" fill="#244f78"/><rect x="570" y="445" width="450" height="105" rx="18" fill="#eee5f5" stroke="#9a72af" stroke-width="2"/><text x="210" y="480" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">EVIDENCE</text><text x="210" y="515" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">digest · HTTPS · receipt · rollback</text><text x="600" y="480" fill="#5b3d6c" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">SEMANTIC SURFACE</text><text x="600" y="515" fill="#26394d" font-family="Arial,sans-serif" font-size="20" font-weight="700">Reframe + Copilot observe and explain</text><path d="M900 350V437" fill="none" stroke="#b75a20" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#a)"/><path d="M570 500H520" fill="none" stroke="#254f78" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#b)"/>
  <text x="70" y="625" fill="#46596b" font-family="Arial,sans-serif" font-size="16">Caddy serves bytes; it does not author, interpret, or publish them.</text><text x="70" y="650" fill="#46596b" font-family="Arial,sans-serif" font-size="16">The Store-native profile remains a separate, explicit topology until migration is proven.</text>
</svg>
