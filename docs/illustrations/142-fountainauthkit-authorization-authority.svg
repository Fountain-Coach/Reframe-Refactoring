<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FountainAuthKit authorization authority</title>
  <desc id="desc">Authentication is upstream of Fountain authorization. FountainAuthKit issues a resource-bound grant to a protected resource, which executes a typed operation and records safe evidence in FountainStore. MIDI2 carries operations but does not replace OAuth authorization.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#282521"/>
    </marker>
    <style>
      .card { fill:#f3efe7; stroke:#282521; stroke-width:2; }
      .soft { fill:#e8dfd1; stroke:#282521; stroke-width:2; }
      .accent { fill:#dce8e2; stroke:#282521; stroke-width:2; }
      .label { font: 25px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#282521; }
      .small { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill:#625b50; }
      .line { fill:none; stroke:#282521; stroke-width:2; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#625b50; stroke-width:2; stroke-dasharray:8 8; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#f8f4ec"/>
  <rect x="28" y="28" width="1144" height="574" rx="8" fill="none" stroke="#b9ad9b" stroke-width="2"/>

  <rect class="soft" x="64" y="94" width="250" height="158" rx="18"/>
  <text class="label" x="92" y="140">AUTHENTICATION</text>
  <text class="small" x="92" y="179">passkey / OIDC</text>
  <text class="small" x="92" y="209">WebAuthn / provider</text>
  <text class="small" x="92" y="239">not Fountain capability</text>

  <rect class="accent" x="362" y="78" width="300" height="190" rx="18"/>
  <text class="label" x="392" y="126">FOUNTAINAUTHKIT</text>
  <text class="small" x="392" y="166">issuer + PKCE</text>
  <text class="small" x="392" y="196">client + resource</text>
  <text class="small" x="392" y="226">capability + expiry</text>
  <text class="small" x="392" y="256">signed grant / keys</text>

  <rect class="card" x="710" y="94" width="426" height="158" rx="18"/>
  <text class="label" x="740" y="140">PROTECTED RESOURCE</text>
  <text class="small" x="740" y="179">MCP / HTTP / FCIS</text>
  <text class="small" x="740" y="209">issuer + resource check</text>
  <text class="small" x="740" y="239">metadata / refusal path</text>

  <path class="line" d="M314 173 H362"/>
  <path class="line" d="M662 173 H710"/>

  <rect class="card" x="174" y="374" width="300" height="144" rx="18"/>
  <text class="label" x="204" y="422">TYPED OPERATION</text>
  <text class="small" x="204" y="462">MIDI2 lifecycle plane</text>
  <text class="small" x="204" y="492">human confirmation</text>

  <rect class="soft" x="690" y="374" width="334" height="144" rx="18"/>
  <text class="label" x="720" y="422">FOUNTAINSTORE</text>
  <text class="small" x="720" y="462">safe facts only</text>
  <text class="small" x="720" y="492">effect receipt</text>

  <path class="line" d="M846 252 V315 H324 V374"/>
  <path class="line" d="M474 446 H690"/>
  <path class="dash" d="M512 268 V326 H850 V374"/>
  <text class="small" x="545" y="314">authorization ≠ execution</text>

  <text class="small" x="64" y="574">identity ≠ grant ≠ token possession ≠ durable effect</text>
  <text class="small" x="748" y="574">delegation remains visible</text>
</svg>
